spring.application.name=config-server

server.port=${CONFIG_SERVICE_PORT:8888}

spring.cloud.config.server.git.uri=${CONFIG_SERVICE_URI:https://github.com/Ferid2003/MF1_ConfigRepo}
# spring.cloud.config.server.git.basedir=target/config
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.timeout=60

# Eureka registration (local props: the config server can't fetch its own config)
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
