description: processor creates song metadata
name: create_song
request:
  method: POST
  url: /songs
  headers:
    Content-Type: application/json
  body:
    id: 1
    name: Song
    artist: Artist
    album: Album
    duration: "03:45"
    year: "2020"
response:
  status: 200
  headers:
    Content-Type: application/json
  body:
    id: 1
