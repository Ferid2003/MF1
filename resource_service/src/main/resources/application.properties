spring.application.name=${RESOURCE_SERVICE_NAME:resource-service}
server.port=${RESOURCE_SERVICE_PORT:8080}
song.service.name=${SONG_SERVICE_NAME:song-service}

spring.datasource.url=${RESOURCE_DB_URL:jdbc:postgresql://localhost:5434/resource-db}
spring.datasource.username=${RESOURCE_DB_USER:postgres}
spring.datasource.password=${RESOURCE_DB_PASSWORD:postgres}

# Frequency of heartbeats sent by the client to the server
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.prefer-ip-address=true
# Frequency of registry data retrieval from the server to the client's local cache
eureka.client.registry-fetch-interval-seconds=5
# Eureka Service Url
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

aws.access.key.id=${AWS_ACCESS_KEY_ID:a}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:a}
aws.region=${AWS_REGION:us-east-1}
aws.s3.endpoint=${S3_ENDPOINT:http://localhost:4566}
aws.s3.bucket=${S3_BUCKET:resources}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.multiplier=2
rabbitmq.exchange=${RABBITMQ_EXCHANGE:exchange-name}
rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:routing-key}
