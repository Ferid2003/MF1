spring.application.name=resource-processor
spring.main.web-application-type=none
server.port=${RESOURCE_PROCESSOR_PORT:8083}

resource.service.name=${RESOURCE_SERVICE_NAME:resource-service}
song.service.name=${SONG_SERVICE_NAME:song-service}

# No web server (web-application-type=none) -> nothing to self-register; discover only.
spring.cloud.service-registry.auto-registration.enabled=false
eureka.client.register-with-eureka=false
# Frequency of heartbeats sent by the client to the server
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.prefer-ip-address=true
# Frequency of registry data retrieval from the server to the client's local cache
eureka.client.registry-fetch-interval-seconds=5
# Eureka Service Url
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
rabbitmq.exchange=${RABBITMQ_EXCHANGE:exchange-name}
rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:routing-key}
rabbitmq.queue=${RABBITMQ_QUEUE:queue-name}
