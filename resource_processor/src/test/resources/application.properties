# Shadows src/main/resources/application.properties in tests: real config comes from the
# config server (resource-processor.properties), which tests don't reach.
spring.application.name=resource-processor
spring.cloud.config.enabled=false
spring.main.web-application-type=none

resource.service.name=resource-service
song.service.name=song-service

rabbitmq.exchange=exchange-name
rabbitmq.routing-key=routing-key
rabbitmq.queue=queue-name
