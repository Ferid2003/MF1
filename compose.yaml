services:
  resource-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${RESOURCE_DB_NAME}
      POSTGRES_USER: ${RESOURCE_DB_USER}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD}
      RESOURCE_DB_EXPOSE_PORT: ${RESOURCE_DB_EXPOSE_PORT}
      RESOURCE_DB_INTERNAL_PORT: ${RESOURCE_DB_INTERNAL_PORT}
    ports:
      - "${RESOURCE_DB_EXPOSE_PORT}:${RESOURCE_DB_INTERNAL_PORT}"
    volumes:
      - ./init-scripts/resource-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESOURCE_DB_USER} -d ${RESOURCE_DB_NAME}"]
      interval: 3s
      retries: 10

  song-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SONG_DB_NAME}
      POSTGRES_USER: ${SONG_DB_USER}
      POSTGRES_PASSWORD: ${SONG_DB_PASSWORD}
      SONG_DB_EXPOSE_PORT: ${SONG_DB_EXPOSE_PORT}
      SONG_DB_INTERNAL_PORT: ${SONG_DB_INTERNAL_PORT}
    ports:
      - "${SONG_DB_EXPOSE_PORT}:${SONG_DB_INTERNAL_PORT}"
    volumes:
      - ./init-scripts/song-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONG_DB_USER} -d ${SONG_DB_NAME}"]
      interval: 3s
      retries: 10

  storage-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${STORAGE_DB_NAME}
      POSTGRES_USER: ${STORAGE_DB_USER}
      POSTGRES_PASSWORD: ${STORAGE_DB_PASSWORD}
    ports:
      - "${STORAGE_DB_EXPOSE_PORT}:${STORAGE_DB_INTERNAL_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STORAGE_DB_USER} -d ${STORAGE_DB_NAME}"]
      interval: 3s
      retries: 10

  storage-service:
    build: ./storage_service
    environment:
      STORAGE_SERVICE_PORT: ${STORAGE_SERVICE_PORT}
      STORAGE_DB_URL: ${STORAGE_DB_URL}
      STORAGE_DB_USER: ${STORAGE_DB_USER}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      EUREKA_SERVICE_URL: http://${EUREKA_SERVICE_NAME}:${EUREKA_SERVICE_PORT}/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${STORAGE_SERVICE_PORT}/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      storage-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      config-service:
        condition: service_healthy

  song-service:
    build: ./song_service
    deploy:
      replicas: 2
    environment:
      SONG_SERVICE_PORT: ${SONG_SERVICE_PORT}
      SONG_DB_URL: ${SONG_DB_URL}
      SONG_DB_USER: ${SONG_DB_USER}
      SONG_DB_PASSWORD: ${SONG_DB_PASSWORD}
      EUREKA_SERVICE_URL: http://${EUREKA_SERVICE_NAME}:${EUREKA_SERVICE_PORT}/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${SONG_SERVICE_PORT}/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      song-db:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      config-service:
        condition: service_healthy

  resource-service:
    build: ./resource_service
    environment:
      RESOURCE_SERVICE_PORT: ${RESOURCE_SERVICE_PORT}
      RESOURCE_DB_URL: ${RESOURCE_DB_URL}
      RESOURCE_DB_USER: ${RESOURCE_DB_USER}
      RESOURCE_DB_PASSWORD: ${RESOURCE_DB_PASSWORD}
      SONG_SERVICE_NAME: ${SONG_SERVICE_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY}
      EUREKA_SERVICE_URL: http://${EUREKA_SERVICE_NAME}:${EUREKA_SERVICE_PORT}/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${RESOURCE_SERVICE_PORT}/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      resource-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      song-service:
        condition: service_healthy
      storage-service:
        condition: service_started
      config-service:
        condition: service_healthy

  resource-processor:
    build: ./resource_processor
    # ponytail: headless RabbitMQ consumer (web-application-type=none) -> no HTTP port, so no port mapping and a process-liveness healthcheck instead of /actuator/health. Switch to an actuator check if it ever gains a web server.
    environment:
      RESOURCE_PROCESSOR_PORT: ${RESOURCE_PROCESSOR_PORT}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      EUREKA_SERVICE_URL: http://${EUREKA_SERVICE_NAME}:${EUREKA_SERVICE_PORT}/eureka/
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f app.jar || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      config-service:
        condition: service_healthy

  localstack:
    image: localstack/localstack:3
    ports:
      - "${S3_PORT}:${S3_PORT}"
    environment:
      SERVICES: s3
    healthcheck:
      # buckets are created by storage-service on startup
      test: ["CMD-SHELL", "awslocal s3api list-buckets"]
      interval: 3s
      retries: 20

  eureka-service:
    build: ./eureka_service
    depends_on:
      config-service:
        condition: service_healthy
    ports:
      - "${EUREKA_SERVICE_PORT}:${EUREKA_SERVICE_PORT}"
    environment:
      EUREKA_SERVICE_PORT: ${EUREKA_SERVICE_PORT}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${EUREKA_SERVICE_PORT}/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
      SONG_SERVICE_NAME: ${SONG_SERVICE_NAME}
      RESOURCE_SERVICE_NAME: ${RESOURCE_SERVICE_NAME}
      EUREKA_SERVICE_PORT: ${EUREKA_SERVICE_PORT}
      EUREKA_SERVICE_URL: http://${EUREKA_SERVICE_NAME}:${EUREKA_SERVICE_PORT}/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${GATEWAY_PORT}/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      eureka-service:
        condition: service_healthy
      song-service:
        condition: service_healthy
      resource-service:
        condition: service_healthy
      config-service:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "${RABBITMQ_MANAGEMENT_CONSOLE_PORT}:${RABBITMQ_MANAGEMENT_CONSOLE_PORT}"
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
    environment:
      RABBITMQ_MANAGEMENT_CONSOLE_PORT: ${RABBITMQ_MANAGEMENT_CONSOLE_PORT}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  config-service:
    build: ./config-service
    restart: on-failure:5 # github clone at startup is flaky from the container network
    extra_hosts:
      - "github.com:140.82.121.4"
    ports:
      - "${CONFIG_SERVICE_PORT}:${CONFIG_SERVICE_PORT}"
    environment:
      CONFIG_SERVICE_PORT: ${CONFIG_SERVICE_PORT}
      EUREKA_SERVICE_URL: http://${EUREKA_SERVICE_NAME}:${EUREKA_SERVICE_PORT}/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${CONFIG_SERVICE_PORT}/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    environment:
      STORAGE_SERVICE_PORT: ${STORAGE_SERVICE_PORT}
      EUREKA_SERVICE_PORT: ${EUREKA_SERVICE_PORT}
      GATEWAY_PORT: ${GATEWAY_PORT}
      RESOURCE_SERVICE_PORT: ${RESOURCE_SERVICE_PORT}
      SONG_SERVICE_PORT: ${SONG_SERVICE_PORT}
    # ponytail: Prometheus can't read env vars in its config, so sed fills the ${VAR} placeholders at startup.
    # Editing prometheus.yml still needs `docker compose restart prometheus`.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e "s/\$${STORAGE_SERVICE_PORT}/$$STORAGE_SERVICE_PORT/g"
        -e "s/\$${EUREKA_SERVICE_PORT}/$$EUREKA_SERVICE_PORT/g"
        -e "s/\$${GATEWAY_PORT}/$$GATEWAY_PORT/g"
        -e "s/\$${RESOURCE_SERVICE_PORT}/$$RESOURCE_SERVICE_PORT/g"
        -e "s/\$${SONG_SERVICE_PORT}/$$SONG_SERVICE_PORT/g"
        /etc/prometheus/prometheus.yml > /tmp/prometheus.yml
        && exec /bin/prometheus --config.file=/tmp/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch
    restart: unless-stopped
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    container_name: logstash
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: kibana
    restart: unless-stopped
    ports:
      - "${KIBANA_PORT}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.0
    container_name: filebeat
    restart: unless-stopped
    # root + docker socket: needed to read other containers' log files and their names
    user: root
    command: filebeat -e --strict.perms=false
    volumes:
      - ./elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash

volumes:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
