services:
  resource-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${RESOURCE_DB_NAME}
      POSTGRES_USER: ${RESOURCE_DB_USER}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD}
      RESOURCE_DB_EXPOSE_PORT: ${RESOURCE_DB_EXPOSE_PORT}
      RESOURCE_DB_INTERNAL_PORT: ${RESOURCE_DB_INTERNAL_PORT}
    ports:
      - "${RESOURCE_DB_EXPOSE_PORT}:${RESOURCE_DB_INTERNAL_PORT}"
    volumes:
      - ./init-scripts/resource-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESOURCE_DB_USER} -d ${RESOURCE_DB_NAME}"]
      interval: 3s
      retries: 10

  song-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SONG_DB_NAME}
      POSTGRES_USER: ${SONG_DB_USER}
      POSTGRES_PASSWORD: ${SONG_DB_PASSWORD}
      SONG_DB_EXPOSE_PORT: ${SONG_DB_EXPOSE_PORT}
      SONG_DB_INTERNAL_PORT: ${SONG_DB_INTERNAL_PORT}
    ports:
      - "${SONG_DB_EXPOSE_PORT}:${SONG_DB_INTERNAL_PORT}"
    volumes:
      - ./init-scripts/song-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONG_DB_USER} -d ${SONG_DB_NAME}"]
      interval: 3s
      retries: 10

  song-service:
    build: ./song_service
    deploy:
      replicas: 2
    ports:
      - "${SONG_SERVICE_PORT_RANGE_LOWER_LIMIT}-${SONG_SERVICE_PORT_RANGE_UPPER_LIMIT}:${SONG_SERVICE_PORT}"
    environment:
      SONG_SERVICE_PORT: ${SONG_SERVICE_PORT}
      SONG_DB_URL: ${SONG_DB_URL}
      SONG_DB_USER: ${SONG_DB_USER}
      SONG_DB_PASSWORD: ${SONG_DB_PASSWORD}
      EUREKA_SERVICE_URL: http://${EUREKA_SERVICE_NAME}:${EUREKA_SERVICE_PORT}/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${SONG_SERVICE_PORT}/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      song-db:
        condition: service_healthy
      eureka-service:
        condition: service_healthy

  resource-service:
    build: ./resource_service
    ports:
      - "${RESOURCE_SERVICE_PORT}:${RESOURCE_SERVICE_PORT}"
    environment:
      RESOURCE_SERVICE_PORT: ${RESOURCE_SERVICE_PORT}
      RESOURCE_DB_URL: ${RESOURCE_DB_URL}
      RESOURCE_DB_USER: ${RESOURCE_DB_USER}
      RESOURCE_DB_PASSWORD: ${RESOURCE_DB_PASSWORD}
      SONG_SERVICE_NAME: ${SONG_SERVICE_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY}
      EUREKA_SERVICE_URL: http://${EUREKA_SERVICE_NAME}:${EUREKA_SERVICE_PORT}/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${RESOURCE_SERVICE_PORT}/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      resource-db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      song-service:
        condition: service_healthy

  resource-processor:
    build: ./resource_processor
    # ponytail: headless RabbitMQ consumer (web-application-type=none) -> no HTTP port, so no port mapping and a process-liveness healthcheck instead of /actuator/health. Switch to an actuator check if it ever gains a web server.
    environment:
      RESOURCE_PROCESSOR_PORT: ${RESOURCE_PROCESSOR_PORT}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      EUREKA_SERVICE_URL: http://${EUREKA_SERVICE_NAME}:${EUREKA_SERVICE_PORT}/eureka/
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f app.jar || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-service:
        condition: service_healthy

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./init-scripts/localstack:/etc/localstack/init/ready.d:ro
    healthcheck:
      # healthy only once the init script has created the bucket
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket ${S3_BUCKET}"]
      interval: 3s
      retries: 20

  eureka-service:
    build: ./eureka_service
    ports:
      - "${EUREKA_SERVICE_PORT}:${EUREKA_SERVICE_PORT}"
    environment:
      EUREKA_SERVICE_PORT: ${EUREKA_SERVICE_PORT}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${EUREKA_SERVICE_PORT}/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
      SONG_SERVICE_NAME: ${SONG_SERVICE_NAME}
      RESOURCE_SERVICE_NAME: ${RESOURCE_SERVICE_NAME}
      EUREKA_SERVICE_PORT: ${EUREKA_SERVICE_PORT}
      EUREKA_SERVICE_URL: http://${EUREKA_SERVICE_NAME}:${EUREKA_SERVICE_PORT}/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${GATEWAY_PORT}/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      eureka-service:
        condition: service_healthy
      song-service:
        condition: service_healthy
      resource-service:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "${RABBITMQ_MANAGEMENT_CONSOLE_PORT}:${RABBITMQ_MANAGEMENT_CONSOLE_PORT}"
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
    environment:
      RABBITMQ_MANAGEMENT_CONSOLE_PORT: ${RABBITMQ_MANAGEMENT_CONSOLE_PORT}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
