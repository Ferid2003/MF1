input {
  beats { port => 5044 }
}

filter {
  # Spring services log ECS JSON (logging.structured.format.console=ecs): lift its fields
  # (traceId, spanId, log.level, service.name, message, ...) to the top level so they are
  # indexed and searchable. Non-JSON lines (postgres, rabbitmq, startup banner) stay as plain text.
  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "mf1-logs-%{+YYYY.MM.dd}"
  }
}
